<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weeknight Table Launch Slides</title>
<style>
:root{--bg:#f2f3ee;--ink:#1d2116;--soft:#5a6052;--accent:#b8432c}
@media (prefers-color-scheme: dark){:root{--bg:#14170f;--ink:#ebeee3;--soft:#a6ad98;--accent:#e07257}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif}
main{max-width:1120px;margin:0 auto;padding:32px 16px 48px}
h1{font-size:clamp(28px,4vw,40px);margin:0 0 6px;letter-spacing:-.02em}
p{color:var(--soft);margin:0 0 24px} a{color:var(--accent);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.grid img{width:100%;height:auto;border-radius:12px;display:block}
</style></head><body><main>
<h1>Instagram launch slides</h1>
<p>Five 1080 x 1350 posts a creator shares to launch the book. <a href="./">Back to the web book</a></p>
<div class="grid"><img src="files/slide-1.jpg" alt="Launch slide 1 of 5" width="1080" height="1350"><img src="files/slide-2.jpg" alt="Launch slide 2 of 5" width="1080" height="1350"><img src="files/slide-3.jpg" alt="Launch slide 3 of 5" width="1080" height="1350"><img src="files/slide-4.jpg" alt="Launch slide 4 of 5" width="1080" height="1350"><img src="files/slide-5.jpg" alt="Launch slide 5 of 5" width="1080" height="1350"></div>
</main></body></html>
